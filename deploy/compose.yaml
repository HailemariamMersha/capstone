services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  udp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "backend.udp_echo", "--host", "0.0.0.0", "--port", "9876", "--allow", "0.0.0.0/0"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["9876:9876/udp"]
  proxy:
    image: caddy:2.11
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
  identity-deletions:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    command: ["python", "-m", "backend.research.deletion_worker"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  caddy_data:
  caddy_config:
