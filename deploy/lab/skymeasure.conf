# Add as a separate site; preserve all existing virtual hosts and listeners.
<VirtualHost *:80>
    ServerName api.hailemariam.com
    Alias /.well-known/acme-challenge/ /var/lib/skymeasure/acme-webroot/.well-known/acme-challenge/
    <Directory /var/lib/skymeasure/acme-webroot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://api.hailemariam.com%{REQUEST_URI} [R=308,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/skymeasure-error.log
    CustomLog /dev/null combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.hailemariam.com
    SSLEngine on
    SSLCertificateFile /etc/skymeasure/tls/fullchain.pem
    SSLCertificateKeyFile /etc/skymeasure/tls/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    # Do not compress or cache measurement bodies. Research JSON compression is
    # explicitly handled by FastAPI and remains available.
    SetEnv no-gzip 1
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    LimitRequestBody 105906176
    ProxyPass / http://127.0.0.1:18000/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:18000/
    ErrorLog ${APACHE_LOG_DIR}/skymeasure-error.log
    # Avoid recording participant addresses and session identifiers in access logs.
    CustomLog /dev/null combined
</VirtualHost>
